---
name: CI / Pre-commit
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pre-commit-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Run pre-commit checks
        uses: ./.github/actions/run-nix-command
        with:
          command: nix flake check
          nativelink-attic-token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}
