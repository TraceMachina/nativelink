---
name: CI / Pre-commit
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Jobs without their own permissions block only check out the repository;
# read-all also implies scopes a GitHub App installation token cannot be
# granted.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pre-commit-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Test CI metadata and dispatch
        run: python3 -m unittest discover -s .github/scripts -p 'test_ci*.py' -v

      - name: Test the fork build-results replay
        env:
          BEP_REPLAY_TESTS_REQUIRED: "1"
        run: |
          python3 -m venv "$RUNNER_TEMP/replay-venv"
          "$RUNNER_TEMP/replay-venv/bin/pip" install --quiet --require-hashes \
            --only-binary=:all: -r .github/scripts/requirements-bep-replay.txt
          "$RUNNER_TEMP/replay-venv/bin/python" -m unittest discover -s .github/scripts \
            -p 'test_ci_bep_replay.py' -v

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}

      - name: Run pre-commit hooks
        run: nix flake check

      - name: Teardown Worker
        uses: ./.github/actions/end-nix
        if: always()
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}
