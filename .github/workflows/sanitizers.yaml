---
name: Sanitizers

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'
      - '**/*.md'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sanitized-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        sanitizer: [asan, tsan]
    name: ${{ matrix.sanitizer }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Free disk space
        uses: ./.github/actions/free-disk

      - name: Setup Bazel
        if: matrix.sanitizer == 'asan'
        uses: >- # v0.19.0
          bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Setup NativeLink Cloud
        if: matrix.sanitizer == 'asan'
        uses: ./.github/actions/setup-nativelink-cloud
        with:
          ci-mode: ${{ vars.NATIVELINK_CI_MODE }}
          claim-base: ${{ secrets.NATIVELINK_STAGING_CLAIM_BASE }}
          bes-results-url: ${{ secrets.NATIVELINK_STAGING_BES_RESULTS_URL }}
          api-key: >-
            ${{ github.event_name == 'push'
                && secrets.NATIVELINK_STAGING_API_KEY_RW
                || secrets.NATIVELINK_STAGING_API_KEY_RO }}
          mode: ${{ github.event_name == 'push' && 'write' || 'read' }}
          # Remote execution only on Linux; the action hard-fails exec on
          # non-Linux runners, so macOS lanes fall back to cache.
          exec: ${{ runner.os == 'Linux' && 'on' || 'off' }}

      - name: Run Bazel tests
        if: matrix.sanitizer == 'asan'
        run: bazel test --config=${{ matrix.sanitizer }} --config=nl-quiet --lockfile_mode=error --verbose_failures //...

      # TSan needs an instrumented standard library. The Bazel Rust
      # toolchain downloads prebuilt std, so use Cargo's build-std here.
      - name: Set up TSan toolchain
        if: matrix.sanitizer == 'tsan'
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Disable AppArmor namespace restrictions
        if: matrix.sanitizer == 'tsan'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Set up Azurite test runner
        if: matrix.sanitizer == 'tsan'
        uses: ./.github/actions/setup-azurite-test-runner

      - name: Run TSan tests
        if: matrix.sanitizer == 'tsan'
        env:
          RUSTFLAGS: -Zsanitizer=thread
          RUSTDOCFLAGS: -Zsanitizer=thread
          RUST_TEST_THREADS: 1
        # https://github.com/bazelbuild/rules_rust/issues/2068: TSan requires `std` to be instrumented
        # rules_rust doesn't support rebuilding `std`
        run: >-
          cargo +nightly test --locked --workspace -Zbuild-std
