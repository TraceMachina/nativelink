---
name: CI / Sanitizers

on:
  # AddressSanitizer is expensive and does not gate merge. Ordinary pull
  # requests stay on the Nix Bazel lane. A release pull request
  # (head branch `release/vX.Y.Z`, as in #3028) runs it, as do the nightly
  # run of main, a published release, and a manual dispatch.
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily (off-peak)
  release:
    types: [published]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sanitized-tests:
    # `branches` above filters the base. The head check keeps this off
    # ordinary pull requests. Other events always run.
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'release/') ||
      startsWith(github.event.pull_request.title, 'Release NativeLink')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        sanitizer: [asan, safestack]
    name: ${{ matrix.sanitizer }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Free disk space
        uses: ./.github/actions/free-disk

      - name: Setup Bazel
        if: matrix.sanitizer == 'asan'
        uses: >- # v0.19.0
          bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Setup NativeLink Cloud
        if: matrix.sanitizer == 'asan'
        uses: ./.github/actions/setup-nativelink-cloud
        with:
          ci-mode: ${{ vars.NATIVELINK_CI_MODE }}
          claim-base: ${{ secrets.NATIVELINK_STAGING_CLAIM_BASE }}
          bes-results-url: ${{ secrets.NATIVELINK_STAGING_BES_RESULTS_URL }}
          # Only the nightly run of main writes the shared cache. A release
          # pull request, a published tag, and any other ref stay read-only.
          api-key: >-
            ${{ github.ref == 'refs/heads/main'
                && secrets.NATIVELINK_STAGING_API_KEY_RW
                || secrets.NATIVELINK_STAGING_API_KEY_RO }}
          mode: ${{ github.ref == 'refs/heads/main' && 'write' || 'read' }}
          # Remote execution only on Linux; the action hard-fails exec on
          # non-Linux runners, so macOS lanes fall back to cache.
          exec: ${{ runner.os == 'Linux' && 'on' || 'off' }}

      - name: Run Bazel tests
        if: matrix.sanitizer == 'asan'
        run: bazel test --config=${{ matrix.sanitizer }} --config=nl-quiet --lockfile_mode=error --verbose_failures //...

      # SafeStack needs an instrumented standard library. The Bazel Rust
      # toolchain downloads prebuilt std, so use Cargo's build-std here.
      - name: Set up SafeStack toolchain
        if: matrix.sanitizer == 'safestack'
        run: rustup toolchain install nightly-2026-08-26 --profile minimal --component rust-src

      - name: Disable AppArmor namespace restrictions
        if: matrix.sanitizer == 'safestack'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Set up Azurite test runner
        if: matrix.sanitizer == 'safestack'
        uses: ./.github/actions/setup-azurite-test-runner

      - name: Run SafeStack tests
        if: matrix.sanitizer == 'safestack'
        env:
          RUSTFLAGS: -Zsanitizer=safestack
          RUSTDOCFLAGS: -Zsanitizer=safestack
          RUST_TEST_THREADS: 1
        # Rebuild std with the same instrumentation; keep host tools unsanitized.
        run: >-
          cargo +nightly-2026-08-26 test --locked --workspace -Zbuild-std --target x86_64-unknown-linux-gnu
