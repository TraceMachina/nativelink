---
name: CI / Fuzz

on:
  # Fuzzing is expensive and does not gate merge. It runs nightly against
  # every target, when a release is published, and on demand, instead of
  # on pull requests.
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily (off-peak)
  release:
    types: [published]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Build fuzzers
        id: build
        uses: >- # v1
          google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1
        with:
          language: rust
          sanitizer: address

      - name: Run fuzzers
        uses: >- # v1
          google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: batch
          sanitizer: address
