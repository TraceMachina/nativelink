---
# Keeps the repository-root llms files (llms.txt, llms-small.txt and
# llms-full.txt) in step with their sources: the marketing site's prose in
# web/apps/web/lib/llms.ts, the blog posts, and the documentation corpus.
#
# The files are committed so that a clone of the repository carries its own
# machine-readable corpus, and generated so that they cannot be hand-edited
# into disagreement with the site. When a change to any source lands on main,
# this regenerates them and opens a PR with auto-merge enabled, the same shape
# as the config-reference workflow. The same two repository settings apply
# (see that file's header): "Allow auto-merge", and a WORKFLOW_PR_TOKEN secret
# so the PR's own checks run.
#
# The site serves the same bytes from web/apps/web/public/, which its build
# regenerates on every deploy; nothing on a page load reads these files.
name: Regenerate llms files

on:
  push:
    branches: [main]
    paths:
      - 'web/apps/web/lib/llms.ts'
      - 'web/apps/web/lib/posts.ts'
      - 'web/apps/web/scripts/gen-llms.ts'
      - 'web/apps/web/content/posts/**'
      - 'web/apps/docs/content/**'
      - 'web/apps/docs/scripts/gen-llms.mjs'
      - 'web/apps/docs/scripts/gen-changelog.mjs'
      - 'CHANGELOG.md'
      - '.github/workflows/llms.yaml'
  # Weekly, to catch a source this list does not name. Monday 04:41,
  # arbitrary, spread away from the other scheduled jobs.
  schedule:
    - cron: 41 4 * * MON
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate and open PR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}

      - name: Regenerate llms files
        working-directory: web
        run: |
          nix develop --impure --command bash -c "
            bun install && bun --filter @nativelink/web gen:llms
          "

      - name: Open auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          FILES="llms.txt llms-small.txt llms-full.txt"
          # shellcheck disable=SC2086
          if [[ -z "$(git status --porcelain -- ${FILES})" ]]; then
            echo "llms files already up to date; nothing to do."
            exit 0
          fi

          BRANCH="docs/llms-regenerate"
          git config user.name "llms bot"
          git config user.email "bot@tracemachina.com"
          git switch -c "${BRANCH}"
          # shellcheck disable=SC2086
          git add ${FILES}
          git commit -m "docs(llms): regenerate llms.txt, llms-small.txt and llms-full.txt"
          git push --force origin "${BRANCH}"

          PR_URL=$(gh pr list --head "${BRANCH}" --base main --state open --json url --jq '.[0].url // empty')
          if [[ -z "${PR_URL}" ]]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "docs(llms): regenerate the repository llms files" \
              --body "Automated regeneration of llms.txt, llms-small.txt and llms-full.txt from web/apps/web/lib/llms.ts, the blog posts and the documentation corpus. Generated by the \`${{ github.workflow }}\` workflow.")
          fi
          echo "PR: ${PR_URL}"

          gh pr merge --auto --squash "${PR_URL}" ||
            echo "::notice::Auto-merge could not be enabled; merge ${PR_URL} manually."

      - name: Teardown Worker
        uses: ./.github/actions/end-nix
        if: always()
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}
