---
# Builds the NativeLink binaries for every supported target, signs each release
# asset with keyless Sigstore cosign, generates an SBOM, and produces SLSA Build
# Level 3 provenance that is attached to the GitHub Release.
#
# This is what the OpenSSF Scorecard "Signed-Releases" check inspects: it reads
# the GitHub Releases API and looks for a cryptographic signature (`*.sig`) plus
# SLSA provenance (`*.intoto.jsonl`) among the release assets. The cosign image
# signatures in GHCR are NOT visible to that check, which is why container-only
# signing left the score at zero.
name: Release / Signed artifacts

on:
  # Fires automatically the moment a maintainer clicks "Publish release".
  release:
    types: [published]
  # Manual entry point for (re)building and signing assets on an existing
  # release tag, e.g. to backfill releases that predate this workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, sign and attach assets to (e.g. v1.5.2)."
        required: true
        type: string

# Jobs without their own permissions block only check out the repository;
# read-all also implies scopes a GitHub App installation token cannot be
# granted.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  setup:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve tag and version
        id: resolve
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [[ -z "${TAG}" ]]; then
            echo "::error::No release tag could be determined."
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    needs: setup
    permissions:
      contents: write # upload assets to the release
      id-token: write # keyless cosign signing via Sigstore
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            attr: nativelink-x86_64-linux
            # The runner shares this target's architecture, so the packaged
            # binary can be executed to prove it actually starts.
            smoke_test: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            attr: nativelink-aarch64-linux
            # Cross-built from x86_64, so the runner cannot execute it.
            smoke_test: false
          - target: aarch64-apple-darwin
            os: macos-26
            attr: nativelink-aarch64-darwin
            smoke_test: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout ${{ needs.setup.outputs.tag }}
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.setup.outputs.tag }}
          persist-credentials: false

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}

      - name: Install Cosign
        uses: >- # v4.1.2
          sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          # Pin cosign: v3.x forces the new bundle format and drops the legacy
          # split signature/certificate output the release assets and verifiers
          # depend on. v2.5.3 still emits .sig/.pem files.
          cosign-release: v2.5.3

      - name: Build static binary
        run: |
          nix build --fallback -L ".#${{ matrix.attr }}"

      - name: Package artifact
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ needs.setup.outputs.version }}"
          ASSET="nativelink-${VERSION}-${{ matrix.target }}"

          # macOS runners ship `shasum` rather than coreutils `sha256sum`; both
          # emit the "<hash>  <name>" format the SLSA generator expects.
          sha256() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            else
              shasum -a 256 "$1"
            fi
          }

          STAGE="$(mktemp -d)"
          install -m 0755 result/bin/nativelink "${STAGE}/nativelink"
          install -m 0644 LICENSE "${STAGE}/LICENSE"
          install -m 0644 README.md "${STAGE}/README.md"
          tar -C "${STAGE}" -czf "${ASSET}.tar.gz" nativelink LICENSE README.md

          sha256 "${ASSET}.tar.gz" | tee "${ASSET}.tar.gz.sha256"
          echo "asset=${ASSET}" >> "${GITHUB_OUTPUT}"

      # The v1.6.6 macOS tarball shipped with an absolute /nix/store install
      # name for libiconv and could not launch on any machine but the builder
      # (#2727). The Nix build now fails on a leftover store reference, and
      # this re-checks the packaged tarball so a regression cannot reach a
      # published release unnoticed.
      - name: Smoke test packaged binary
        if: matrix.smoke_test
        run: |
          set -euo pipefail
          ASSET="${{ steps.package.outputs.asset }}"
          CHECK="$(mktemp -d)"
          tar -C "${CHECK}" -xzf "${ASSET}.tar.gz"

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            otool -L "${CHECK}/nativelink"
            if otool -L "${CHECK}/nativelink" | tail -n +2 | grep '/nix/store'; then
              echo "::error::Packaged macOS binary links against /nix/store paths that do not exist on user machines."
              exit 1
            fi
            codesign --verify --verbose "${CHECK}/nativelink"
          fi

          # nativelink exits non-zero with a usage message when handed no
          # config file. Reaching that message proves dyld loaded the binary
          # and it ran, which is all this check needs to establish.
          output="$("${CHECK}/nativelink" 2>&1 || true)"
          echo "${output}"
          if ! echo "${output}" | grep -q 'Usage: nativelink'; then
            echo "::error::Packaged binary for ${{ matrix.target }} did not start."
            exit 1
          fi

      - name: Generate SBOM
        uses: >- # v0.24.0
          anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          file: result/bin/nativelink
          format: spdx-json
          output-file: ${{ steps.package.outputs.asset }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign artifact and SBOM (keyless)
        run: |
          set -euo pipefail
          ASSET="${{ steps.package.outputs.asset }}"
          for f in "${ASSET}.tar.gz" "${ASSET}.spdx.json"; do
            # Cosign is pinned to v2.5.3 (see the install step) so these flags
            # produce the split .sig/.pem files the release assets and verifiers
            # expect; --new-bundle-format=false keeps that explicit.
            cosign sign-blob --yes \
              --new-bundle-format=false \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done

      - name: Upload assets to release
        run: |
          set -euo pipefail
          ASSET="${{ steps.package.outputs.asset }}"
          gh release upload "${{ needs.setup.outputs.tag }}" \
            "${ASSET}.tar.gz" \
            "${ASSET}.tar.gz.sig" \
            "${ASSET}.tar.gz.pem" \
            "${ASSET}.spdx.json" \
            "${ASSET}.spdx.json.sig" \
            "${ASSET}.spdx.json.pem" \
            --clobber

      - name: Upload hash for provenance
        uses: >- # v4.6.0
          actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: sha256-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 5

  build-windows:
    name: Build x86_64-pc-windows-msvc
    needs: setup
    permissions:
      contents: write # upload assets to the release
      id-token: write # keyless cosign signing via Sigstore
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_LC_SYS_PREBUILT_NASM: 1
      # Statically link the MSVC CRT so the release binary does not require the
      # Visual C++ Redistributable (`VCRUNTIME140.dll`) on clean Windows Server
      # Core / container hosts (Windows equivalent of Linux `+crt-static` and
      # macOS #2727).
      RUSTFLAGS: -C target-feature=+crt-static
      CARGO_PROFILE_RELEASE_STRIP: "true"
    steps:
      - name: Checkout ${{ needs.setup.outputs.tag }}
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.setup.outputs.tag }}
          persist-credentials: false

      - name: Set up Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          RUST_VERSION="$(sed -nE 's/^rust-version = "([^"]+)".*/\1/p' Cargo.toml | head -n1 | tr -d '\r')"
          if [[ -z "${RUST_VERSION}" ]]; then
            echo "::error::Could not determine rust-version from Cargo.toml."
            exit 1
          fi
          rustup toolchain install "${RUST_VERSION}" --profile minimal --no-self-update
          rustup default "${RUST_VERSION}"

      - name: Install Cosign
        uses: >- # v4.1.2
          sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          # Pinned to v2.5.3 so cosign emits split .sig/.pem files (see `build` job).
          cosign-release: v2.5.3

      - name: Build Windows binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --bin nativelink --release

      - name: Package artifact
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ needs.setup.outputs.version }}"
          $asset = "nativelink-${version}-x86_64-pc-windows-msvc"
          $stage = Join-Path $env:RUNNER_TEMP "stage-win"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/nativelink.exe "$stage/nativelink.exe"
          Copy-Item LICENSE "$stage/LICENSE"
          Copy-Item README.md "$stage/README.md"
          Compress-Archive -Path "$stage/*" -DestinationPath "${asset}.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 -Path "${asset}.zip").Hash.ToLowerInvariant()
          $line = "${hash}  ${asset}.zip"
          Write-Output $line
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "${asset}.zip.sha256"),
            "${line}`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          "asset=${asset}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Smoke test packaged binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $asset = "${{ steps.package.outputs.asset }}"
          $check = Join-Path $env:RUNNER_TEMP "check-win"
          Expand-Archive -Path "${asset}.zip" -DestinationPath $check -Force

          # Verify the MSVC CRT was statically linked (no VCRUNTIME140.dll import).
          $dumpbin = Get-ChildItem -Path "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin\.exe$' } |
            Select-Object -First 1
          if (-not $dumpbin) {
            Write-Error "Could not locate dumpbin.exe to verify static CRT linkage."
            exit 1
          }
          $imports = (& $dumpbin.FullName /dependents "$check/nativelink.exe" | Out-String)
          if ($LASTEXITCODE -ne 0) {
            Write-Error "dumpbin /dependents failed with exit code $LASTEXITCODE."
            exit 1
          }
          Write-Output $imports
          if ($imports -match 'VCRUNTIME140|MSVCP140|ucrtbase|api-ms-win-crt-') {
            Write-Error "Packaged Windows binary dynamically imports MSVC CRT DLLs."
            exit 1
          }

          $out = (& "$check/nativelink.exe" 2>&1 | Out-String)
          Write-Output $out
          if ($out -notmatch 'Usage: nativelink') {
            Write-Error "Packaged Windows binary did not start."
            exit 1
          }
          # Clear LASTEXITCODE (clap exits 2 with no arguments) so the GitHub
          # Actions pwsh epilogue does not fail the step.
          $global:LASTEXITCODE = 0

      - name: Generate SBOM
        uses: >- # v0.24.0
          anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          file: target/release/nativelink.exe
          format: spdx-json
          output-file: ${{ steps.package.outputs.asset }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign artifact and SBOM (keyless)
        shell: bash
        run: |
          set -euo pipefail
          ASSET="${{ steps.package.outputs.asset }}"
          for f in "${ASSET}.zip" "${ASSET}.spdx.json"; do
            cosign sign-blob --yes \
              --new-bundle-format=false \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done

      - name: Upload assets to release
        shell: bash
        run: |
          set -euo pipefail
          ASSET="${{ steps.package.outputs.asset }}"
          gh release upload "${{ needs.setup.outputs.tag }}" \
            "${ASSET}.zip" \
            "${ASSET}.zip.sig" \
            "${ASSET}.zip.pem" \
            "${ASSET}.spdx.json" \
            "${ASSET}.spdx.json.sig" \
            "${ASSET}.spdx.json.pem" \
            --clobber

      - name: Upload hash for provenance
        uses: >- # v4.6.0
          actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: sha256-x86_64-pc-windows-msvc
          path: ${{ steps.package.outputs.asset }}.zip.sha256
          if-no-files-found: error
          retention-days: 5

  combine-hashes:
    name: Combine artifact hashes
    needs: [build, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      subjects: ${{ steps.hashes.outputs.subjects }}
    steps:
      - name: Download hashes
        uses: >- # v4.3.0
          actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: sha256-*
          path: hashes
          merge-multiple: true

      - name: Combine into base64 subjects
        id: hashes
        run: |
          set -euo pipefail
          cat hashes/*.sha256 > combined.sha256
          echo "subjects=$(base64 -w0 < combined.sha256)" >> "${GITHUB_OUTPUT}"

  provenance:
    name: Generate SLSA provenance
    needs: [setup, combine-hashes]
    permissions:
      actions: read # read the workflow run to build provenance
      id-token: write # keyless signing of the provenance
      contents: write # attach provenance to the release
    # The SLSA generator MUST be referenced by an immutable semver tag, not a
    # commit SHA: slsa-verifier validates the reusable-workflow ref to confirm a
    # trusted builder produced the provenance, so a SHA pin would fail
    # verification. This is the one intentional exception to SHA-pinning here.
    uses: > # v2.1.0
      slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
    with:
      base64-subjects: ${{ needs.combine-hashes.outputs.subjects }}
      upload-assets: true
      upload-tag-name: ${{ needs.setup.outputs.tag }}
      provenance-name: nativelink-${{ needs.setup.outputs.version }}.intoto.jsonl
