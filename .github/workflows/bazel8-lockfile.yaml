---
# Keeps MODULE.bazel8.lock in step with the module and crate graph.
#
# The Bazel 8.8.2 compatibility lane runs with --lockfile_mode=error against
# this committed lockfile, and Bazel fails that mode whenever a module
# extension's facts change — which happens on every crate graph change. A
# lockfile has to be generated by the Bazel version that consumes it, on
# Linux x86-64 to match the lane, so contributors cannot be asked to keep it
# current by hand. When a change to any source of the graph lands on main,
# this regenerates the file and opens a PR with auto-merge enabled, the same
# shape as the llms and config-reference workflows, and with the same two
# repository settings ("Allow auto-merge", and a WORKFLOW_PR_TOKEN secret so
# the PR's own checks run).
#
# .github/scripts/README-bazel8-lockfile.md documents the manual procedure.
name: CI / Bazel 8 lockfile

on:
  push:
    branches: [main]
    paths:
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "Cargo.lock"
      - ".bazelversion"
      - ".github/workflows/bazel8-lockfile.yaml"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate and open PR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      USE_BAZEL_VERSION: 8.8.2
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main

      - name: Setup Bazel
        uses: >- # v0.19.0
          bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Regenerate the Bazel 8 lockfile
        run: |
          # Resolution only; nothing is built and no remote services are
          # used. The default lockfile is seeded, updated by Bazel 8, copied
          # out, and restored, mirroring README-bazel8-lockfile.md.
          cp MODULE.bazel8.lock MODULE.bazel.lock
          bazel mod deps --lockfile_mode=update
          cp MODULE.bazel.lock MODULE.bazel8.lock
          git restore MODULE.bazel.lock

      - name: Open auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- MODULE.bazel8.lock)" ]]; then
            echo "MODULE.bazel8.lock already up to date; nothing to do."
            exit 0
          fi

          BRANCH="ci/bazel8-lockfile-regenerate"
          git config user.name "bazel8 lockfile bot"
          git config user.email "bot@tracemachina.com"
          git switch -c "${BRANCH}"
          git add MODULE.bazel8.lock
          git commit -m "ci: regenerate MODULE.bazel8.lock for the current module graph"
          git push --force origin "${BRANCH}"

          PR_URL=$(gh pr list --head "${BRANCH}" --base main --state open --json url --jq '.[0].url // empty')
          if [[ -z "${PR_URL}" ]]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "ci: regenerate the Bazel 8 compatibility lockfile" \
              --body "Automated regeneration of MODULE.bazel8.lock after a module or crate graph change, so the nightly Bazel 8.8.2 lane keeps passing --lockfile_mode=error. Generated by the \`${{ github.workflow }}\` workflow.")
          fi
          echo "PR: ${PR_URL}"

          gh pr merge --auto --squash "${PR_URL}" ||
            echo "::notice::Auto-merge could not be enabled; merge ${PR_URL} manually."
