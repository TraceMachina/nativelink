---
name: CI / Nix

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'
  # Two jobs here run only on the nightly schedule and on demand: Cargo Dev
  # (nix-cargo) and the end-to-end integration tests (buildstream, buck2,
  # mongo). See their per-job `if`. The rest (Bazel Dev, installation and the
  # RBE toolchain matrix) stay on the per-PR path and skip the nightly run via
  # `if: != 'schedule'`.
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily (off-peak)
  workflow_dispatch:
    inputs:
      rbe_only:
        description: Run only the RBE matrix
        type: boolean
        default: false

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  nix-bazel:
    if: ${{ github.event_name != 'schedule' && inputs.rbe_only != true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    name: Bazel Dev / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}

      - name: Setup NativeLink Cloud
        uses: ./.github/actions/setup-nativelink-cloud
        with:
          ci-mode: ${{ vars.NATIVELINK_CI_MODE }}
          claim-base: ${{ secrets.NATIVELINK_STAGING_CLAIM_BASE }}
          bes-results-url: ${{ secrets.NATIVELINK_STAGING_BES_RESULTS_URL }}
          api-key: >-
            ${{ github.event_name == 'push'
                && secrets.NATIVELINK_STAGING_API_KEY_RW
                || secrets.NATIVELINK_STAGING_API_KEY_RO }}
          mode: ${{ github.event_name == 'push' && 'write' || 'read' }}
          # Remote execution only on Linux; the action hard-fails exec on
          # non-Linux runners, so macOS lanes fall back to cache.
          exec: ${{ runner.os == 'Linux' && 'on' || 'off' }}

      - name: Invoke Bazel build in Nix shell
        run: |
          # --config=nl-toolchain pins the hermetic LLVM + downloaded Rust
          # toolchain identity. Without it, compiles inside `nix develop`
          # resolve the nix-store default toolchain, baking /nix/store/<hash>
          # paths into every action key — which is why this lane previously got
          # 0 remote cache hits against a cache warmed off a non-nix toolchain.
          # Pinning the hermetic identity makes this lane's action digests match
          # a warm writer that uses the same identity. No remote executor is
          # added here: this is cache-read keyed by a stable toolchain, not RBE.
          nix develop --impure --command \
            bazel-retry test //... \
              --config=nl-toolchain \
              --config=nl-quiet \
              --verbose_failures \
              --lockfile_mode=error \

      - name: Teardown Worker
        uses: ./.github/actions/end-nix
        if: always()
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}

  # Cargo Dev (Linux-only) moved off the per-PR critical path: nightly / on-demand only.
  nix-cargo:
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.rbe_only != true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    name: Cargo Dev / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}

      - name: Rust cache
        uses: >- # v2.9.1
          Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Set up Azurite test runner
        uses: ./.github/actions/setup-azurite-test-runner

      - name: Invoke Cargo build in Nix shell
        run: >
          nix develop --impure --command
          bash -c "cargo test --all --profile=smol"

      - name: Teardown Worker
        uses: ./.github/actions/end-nix
        if: always()
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}

  installation:
    if: ${{ github.event_name != 'schedule' && inputs.rbe_only != true }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
    name: Installation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}

      - name: Test nix run
        run: |
          nix run -L .#nativelink-is-executable-test

      - name: Teardown Worker
        uses: ./.github/actions/end-nix
        if: always()
        with:
          nix_name: .#nativelink-is-executable-test
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}

  integration:
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.rbe_only != true }}
    name: ${{ matrix.test-name }}
    strategy:
      matrix:
        test-name: [buildstream, buck2, mongo]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}

      - name: Test ${{ matrix.test-name }} run
        run: |
          nix run -L .#${{ matrix.test-name }}-with-nativelink-test

      - name: Teardown Worker
        uses: ./.github/actions/end-nix
        if: always()
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}
          nix_name: .#${{ matrix.test-name }}-with-nativelink-test

  # rbe-toolchain is slow because it has many subcommands, so split it out
  generate-rbe-commands:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}
          skip_free_disk: true # because we don't need much for this action

      - name: Get commands list
        run: |
          COMMANDS=$(nix run .#rbe-toolchain-list)
          echo "matrix={\"command\":${COMMANDS}}" >> $GITHUB_OUTPUT
        id: set-matrix

  rbe-toolchain:
    if: ${{ github.event_name != 'schedule' }}
    name: rbe ${{ matrix.command}}
    needs: [generate-rbe-commands]
    strategy:
      matrix: ${{fromJson(needs.generate-rbe-commands.outputs.matrix)}}
    runs-on: ubuntu-24.04
    # Experimental stand-in for ghcr.io/tracemachina/nativelink-ci:nix-rbe.
    # Private package, so the job has to log in. Digest is the manual publish
    # from PR 3008; the version is removed after 2026-10-28T17:00:00Z.
    container:
      image: ghcr.io/tracemachina/nativelink-ci-experimental:nix-rbe-pr-3008-gha@sha256:58f7f2f4407c5ca774bbc51baa23678ac6b31740b9752dee9f0e514a474a646d
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        NIX_CONFIG: experimental-features = nix-command flakes
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}
          nix_preinstalled: true
          skip_free_disk: true

      - name: Test ${{ matrix.command }} with rbe
        run: |
          nix run -L .#rbe-toolchain-with-nativelink-test ${{ matrix.command }}

      - name: Teardown Worker
        uses: ./.github/actions/end-nix
        if: always()
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}
          nix_name: .#rbe-toolchain-with-nativelink-test
