---
name: CI / Nix

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'
  # Two jobs here run only on the nightly schedule and on demand: Cargo Dev
  # (nix-cargo) and the end-to-end integration tests (buildstream, buck2,
  # mongo). See their per-job `if`. The installation and
  # RBE toolchain matrix stay on the per-PR path and skip the nightly run via
  # `if: != 'schedule'`. The primary Bazel lane is CI / NativeLink.
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily (off-peak)
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Cargo Dev (Linux-only) moved off the per-PR critical path: nightly / on-demand only.
  nix-cargo:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    name: Cargo Dev / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}

      - name: Rust cache
        uses: >- # v2.9.1
          Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Set up Azurite test runner
        uses: ./.github/actions/setup-azurite-test-runner

      - name: Invoke Cargo build in Nix shell
        run: >
          nix develop --impure --command
          bash -c "cargo test --all --profile=smol"

      - name: Teardown Worker
        uses: ./.github/actions/end-nix
        if: always()
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}

  installation:
    if: ${{ github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
    name: Installation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}

      - name: Test nix run
        run: |
          nix run -L .#nativelink-is-executable-test

      - name: Teardown Worker
        uses: ./.github/actions/end-nix
        if: always()
        with:
          nix_name: .#nativelink-is-executable-test
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}

  integration:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    name: ${{ matrix.test-name }}
    strategy:
      matrix:
        test-name: [buildstream, buck2, mongo]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}

      - name: Test ${{ matrix.test-name }} run
        run: |
          nix run -L .#${{ matrix.test-name }}-with-nativelink-test

      - name: Teardown Worker
        uses: ./.github/actions/end-nix
        if: always()
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}
          nix_name: .#${{ matrix.test-name }}-with-nativelink-test

  # rbe-toolchain is slow because it has many subcommands, so split it out
  generate-rbe-commands:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}
          skip_free_disk: true # because we don't need much for this action

      - name: Get commands list
        run: |
          COMMANDS=$(nix run .#rbe-toolchain-list)
          echo "matrix={\"command\":${COMMANDS}}" >> $GITHUB_OUTPUT
        id: set-matrix

  rbe-toolchain:
    if: ${{ github.event_name != 'schedule' }}
    name: rbe ${{ matrix.command}}
    needs: [generate-rbe-commands]
    strategy:
      matrix: ${{fromJson(needs.generate-rbe-commands.outputs.matrix)}}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}

      - name: Test ${{ matrix.command }} with rbe
        run: |
          nix run -L .#rbe-toolchain-with-nativelink-test ${{ matrix.command }}

      - name: Teardown Worker
        uses: ./.github/actions/end-nix
        if: always()
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}
          nix_name: .#rbe-toolchain-with-nativelink-test
