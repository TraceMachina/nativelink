---
name: CI / Bazel

on:
  # Check Redis topologies before merging; Bazel 8 runs on the daily schedule.
  # CI / NativeLink runs the project-pinned Bazel suite separately.
  # Web-only changes are covered by CI / Web and skip the Bazel lanes.
  pull_request:
    branches: [main]
    paths-ignore:
      - "web/**"
      - ".github/styles/**"
  push:
    branches: [main]
    paths-ignore:
      - "web/**"
      - ".github/styles/**"
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily (off-peak)
  workflow_dispatch:

# Jobs without their own permissions block only need checkout. ci-metadata
# degrades to a notice when the token cannot list this run's jobs, and a
# pull-request build's token is capped at contents:read when it is minted
# from a GitHub App installation.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit-tests:
    # Check Bazel 8 on the nightly schedule or by manual dispatch. The pinned
    # Bazel 9 suite continues to test pull requests and branch pushes.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Deterministic Bazel compatibility lane. Randomizing Bazel versions
          # makes failures harder to reproduce. Use a separate lockfile
          # generated by this version; the default belongs to Bazel 9.
          - os: ubuntu-24.04
            bazel_version: 8.8.2
            check_name: ubuntu-24.04 / Bazel 8.8.2
    name: ${{ matrix.check_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Write Bazel CI metadata
        uses: ./.github/actions/ci-metadata

      - name: Free disk space
        uses: ./.github/actions/free-disk

      - name: Setup NativeLink Cloud
        id: setup-nativelink-cloud
        uses: ./.github/actions/setup-nativelink-cloud
        with:
          ci-mode: ${{ vars.NATIVELINK_CI_MODE }}
          claim-base: ${{ secrets.NATIVELINK_STAGING_CLAIM_BASE }}
          bes-results-url: ${{ secrets.NATIVELINK_STAGING_BES_RESULTS_URL }}
          api-key: >-
            ${{ github.event_name == 'push'
                && secrets.NATIVELINK_STAGING_API_KEY_RW
                || secrets.NATIVELINK_STAGING_API_KEY_RO }}
          mode: ${{ github.event_name == 'push' && 'write' || 'read' }}
          # Remote execution only on Linux; the action hard-fails exec on
          # non-Linux runners, so macOS lanes fall back to cache.
          exec: ${{ runner.os == 'Linux' && 'on' || 'off' }}

      - name: Setup Bazel
        uses: >- # v0.19.0
          bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-cache: true
          repository-cache: true
          # Only enable when we don't have remote cache, otherwise it just gets very slow
          # and enormous
          disk-cache: ${{ steps.setup-nativelink-cloud.outputs.enabled == 'false'}}

      - name: Show Bazel version
        run: bazel --version

      - name: Run Bazel compatibility tests
        run: |
          # See .github/scripts/README-bazel8-lockfile.md for regeneration.
          cp MODULE.bazel8.lock MODULE.bazel.lock
          # The staging remote cache can drop a blob between its existence
          # check and the consuming action ("lost inputs"). Let Bazel retry
          # the invocation and re-execute the producers instead of failing.
          # Bazel records the client environment; keep the job token out.
          env -u BAZELISK_GITHUB_TOKEN ./tools/bazel-retry.sh test //... \
            --config=nl-quiet \
            --lockfile_mode=error \
            --extra_toolchains=@rust_toolchains//:all \
            --experimental_remote_cache_eviction_retries=5 \
            --verbose_failures

  redis-store-tester:
    name: Redis store tester
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Write Bazel CI metadata
        uses: ./.github/actions/ci-metadata

      - name: Free disk space
        uses: ./.github/actions/free-disk

      - uses: hoverkraft-tech/compose-action@11beaa1c2dae4e8ed7b1665aa074723b6cecb0e4 # v3.0.0
        with:
          compose-file: src/bin/docker-compose.store-tester.yaml

      - name: Setup NativeLink Cloud
        id: setup-nativelink-cloud
        uses: ./.github/actions/setup-nativelink-cloud
        with:
          ci-mode: ${{ vars.NATIVELINK_CI_MODE }}
          claim-base: ${{ secrets.NATIVELINK_STAGING_CLAIM_BASE }}
          bes-results-url: ${{ secrets.NATIVELINK_STAGING_BES_RESULTS_URL }}
          api-key: >-
            ${{ github.event_name == 'push'
                && secrets.NATIVELINK_STAGING_API_KEY_RW
                || secrets.NATIVELINK_STAGING_API_KEY_RO }}
          mode: ${{ github.event_name == 'push' && 'write' || 'read' }}
          # Remote execution only on Linux; the action hard-fails exec on
          # non-Linux runners, so macOS lanes fall back to cache.
          exec: ${{ runner.os == 'Linux' && 'on' || 'off' }}

      - name: Setup Bazel
        uses: >- # v0.19.0
          bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-cache: true
          repository-cache: true
          # Only enable when we don't have remote cache, otherwise it just gets very slow
          # and enormous
          disk-cache: ${{ steps.setup-nativelink-cloud.outputs.enabled == 'false'}}

      - name: Run Store tester with sentinel
        run: |
          ./tools/bazel-retry.sh run //:redis_store_tester \
            --lockfile_mode=error \
            --extra_toolchains=@rust_toolchains//:all \
            --experimental_remote_cache_eviction_retries=5 \
            --verbose_failures -- --redis-mode sentinel --mode sequential
        env:
          RUST_LOG: trace
          REDIS_HOST: localhost
          MAX_LOOPS: 10 # running sequentially just to test all the actions work

      - name: Run Store tester with standard
        run: |
          ./tools/bazel-retry.sh run //:redis_store_tester \
            --lockfile_mode=error \
            --extra_toolchains=@rust_toolchains//:all \
            --experimental_remote_cache_eviction_retries=5 \
            --verbose_failures -- --redis-mode standard --mode sequential
        env:
          RUST_LOG: trace
          REDIS_HOST: localhost
          MAX_LOOPS: 10 # running sequentially just to test all the actions work

      - name: Run Store tester with cluster
        run: |
          ./tools/bazel-retry.sh run //:redis_store_tester \
            --lockfile_mode=error \
            --extra_toolchains=@rust_toolchains//:all \
            --experimental_remote_cache_eviction_retries=5 \
            --verbose_failures -- --redis-mode cluster --mode sequential
        env:
          RUST_LOG: trace
          REDIS_HOST: localhost
          MAX_LOOPS: 10 # running sequentially just to test all the actions work
