name: CI / NativeLink

on:
  # Web-only changes are covered by CI / Web and skip the Bazel lanes.
  pull_request:
    branches: [main]
    paths-ignore:
      - "web/**"
      - ".github/styles/**"
  push:
    branches: ["**"]
    paths-ignore:
      - "web/**"
      - ".github/styles/**"
  workflow_dispatch:
    inputs:
      repetitions:
        description: Identical-source iterations (1–20)
        default: "1"
        required: true
        type: string

permissions:
  contents: read

# Keep the filename stable: the federated identity is bound to this workflow.
# Branch builds dispatch to the retained cluster client. Repository PR merge
# commits use remote execution from hosted clients; forks use read-only caching.
concurrency:
  group: cluster-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    name: NativeLink / Linux (PR)
    # PR refs need an environment policy for refs/pull/*/merge. This job gets
    # only the build-service key; GCP federation still rejects PR identities.
    environment: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'cluster-ci-benchmark' || 'public-ci' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Write Bazel CI metadata
        uses: ./.github/actions/ci-metadata

      - name: Free disk space
        uses: ./.github/actions/free-disk

      - name: Setup NativeLink Cloud
        if: github.event.pull_request.head.repo.full_name != github.repository
        id: setup-nativelink-cloud
        uses: ./.github/actions/setup-nativelink-cloud
        with:
          ci-mode: ${{ vars.NATIVELINK_CI_MODE }}
          mode: read
          exec: "off"

      - name: Configure loadtest remote execution
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          NL_API_KEY: ${{ secrets.NATIVELINK_CLUSTER_API_KEY }}
          NL_CLUSTER_ENDPOINT: ${{ vars.NATIVELINK_CLUSTER_ENDPOINT }}
          NL_CLUSTER_BEP_ENDPOINT: ${{ vars.NATIVELINK_CLUSTER_BEP_ENDPOINT }}
          NL_INSTANCE: ${{ vars.NATIVELINK_CLUSTER_INSTANCE }}
          NL_RESULTS_URL: ${{ vars.NATIVELINK_CLUSTER_RESULTS_URL }}
          NL_WORKER_IMAGE: ${{ vars.NATIVELINK_CLUSTER_WORKER_IMAGE }}
        run: python3 .github/scripts/ci_benchmark.py configure-pr --output user.bazelrc

      - name: Require remote execution for repository PRs
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! grep -qx 'common --config=nl-rbe' user.bazelrc; then
            echo "::error::This PR requires remote execution. Check the loadtest CI configuration."
            exit 1
          fi

      - name: Setup Bazel
        uses: >- # v0.19.0
          bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ steps.setup-nativelink-cloud.outputs.enabled == 'false' }}

      - name: Show Bazel version
        run: bazel --version

      - name: Prepare build event directory
        run: mkdir -p "$RUNNER_TEMP/bep"

      - name: Run project-pinned Bazel tests
        env:
          NL_API_KEY: ${{ secrets.NATIVELINK_CLUSTER_API_KEY }}
          NL_ENDPOINTS: ${{ vars.NATIVELINK_CLUSTER_ENDPOINT }} ${{ vars.NATIVELINK_CLUSTER_BEP_ENDPOINT }}
        run: |
          # Bazel records the client environment; keep the job token out.
          # Forks get an empty key, whose name staging would still refuse.
          [ -n "$NL_API_KEY" ] || unset NL_API_KEY
          env -u BAZELISK_GITHUB_TOKEN ./tools/bazel-retry.sh test //... \
            --config=nl-toolchain \
            --config=nl-quiet \
            --lockfile_mode=error \
            --verbose_failures \
            --build_event_binary_file="$RUNNER_TEMP/bep/events.pb"

      # Keyless runs only: event files record the key a run held.
      - name: Stage build events for the build-results UI
        if: always() && contains(fromJSON('["public", "none"]'), steps.setup-nativelink-cloud.outputs.credential)
        run: |
          python3 .github/scripts/ci_bep_artifact.py \
            --events "$RUNNER_TEMP/bep/events.pb" \
            --output "$RUNNER_TEMP/bep-artifact"

      - name: Upload build events
        if: always() && contains(fromJSON('["public", "none"]'), steps.setup-nativelink-cloud.outputs.credential)
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: bep-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/bep-artifact/
          if-no-files-found: ignore
          retention-days: 7

  cluster:
    if: >-
      github.repository == 'TraceMachina/nativelink' &&
      startsWith(github.ref, 'refs/heads/') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: NativeLink / Linux
    environment: cluster-ci-benchmark
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # Job-level rather than step-level: the runner echoes a step's env block
    # into the log header, and these cluster coordinates do not belong in
    # console output.
    env:
      NL_GCP_PROVIDER: ${{ vars.NL_GCP_PROVIDER }}
      NL_GCP_SERVICE_ACCOUNT: ${{ vars.NL_GCP_SERVICE_ACCOUNT }}
      NL_GKE_SERVER: ${{ vars.NL_GKE_SERVER }}
      NL_GKE_CA_DATA: ${{ vars.NL_GKE_CA_DATA }}
      NL_GKE_NAMESPACE: ${{ vars.NL_GKE_NAMESPACE }}
      NL_GKE_POD: ${{ vars.NL_GKE_POD }}
    steps:
      - name: Start setup timer
        run: echo "BENCHMARK_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Write Bazel CI metadata
        uses: ./.github/actions/ci-metadata

      - name: Test CI reporting and credential isolation
        run: python3 -m unittest discover -s .github/scripts -p 'test_ci*.py' -v

      - name: Install pinned cluster client
        run: |
          curl --fail --location --retry 3 \
            https://dl.k8s.io/release/v1.36.3/bin/linux/amd64/kubectl \
            -o "$RUNNER_TEMP/kubectl"
          echo "ebbd080e7c2e275093b55915722043257eb24004363e20acb3c4d71919f88336  $RUNNER_TEMP/kubectl" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run on the retained cluster client
        env:
          NL_API_KEY: ${{ secrets.NATIVELINK_CLUSTER_API_KEY }}
          NL_CLUSTER_ENDPOINT: ${{ vars.NATIVELINK_CLUSTER_ENDPOINT }}
          NL_CLUSTER_BEP_ENDPOINT: ${{ vars.NATIVELINK_CLUSTER_BEP_ENDPOINT }}
          NL_INSTANCE: ${{ vars.NATIVELINK_CLUSTER_INSTANCE }}
          NL_RESULTS_URL: ${{ vars.NATIVELINK_CLUSTER_RESULTS_URL }}
          NL_WORKER_IMAGE: ${{ vars.NATIVELINK_CLUSTER_WORKER_IMAGE }}
          REPETITIONS: ${{ inputs.repetitions || '1' }}
        run: |
          python3 .github/scripts/cluster_ci.py --repetitions "$REPETITIONS" \
            --output "$RUNNER_TEMP/benchmark-summary"

      - name: Summarize build, tests and cache reuse
        if: always()
        env:
          NL_RESULTS_URL: ${{ vars.NATIVELINK_CLUSTER_RESULTS_URL }}
        run: |
          if [ -f "$RUNNER_TEMP/benchmark-summary/cluster.json" ]; then
            python3 .github/scripts/ci_benchmark.py summarize \
              "$RUNNER_TEMP/benchmark-summary/cluster.json" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload aggregate evidence only
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: cluster-ci
          path: ${{ runner.temp }}/benchmark-summary/*.json
          if-no-files-found: error
          retention-days: 14
