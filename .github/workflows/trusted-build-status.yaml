---
name: CI / Trusted build status

# Metadata only: never check out PR code or download build artifacts here.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_run:
    workflows: [CI / NativeLink, CI / Nix]
    types: [requested, in_progress, completed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

# Serialize updates for the same commit. Every update reads the current API
# state, so a late event cannot restore a superseded build's success.
concurrency:
  group: trusted-build-status-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.repository == 'TraceMachina/nativelink' &&
      (github.event_name == 'pull_request_target' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)))
    name: Report trusted build results
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted status reporter
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # GITHUB_SHA is the trusted base/default branch for both events.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Update the PR commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/ci_trusted_builds.py
