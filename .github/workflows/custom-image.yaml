name: Images / Custom

# Publish an image for the commit selected in workflow_dispatch. Dispatch
# requires write access, and the workflow file and the checkout are that
# same commit, so the publish credentials stay on a commit that already
# lives in this repository.
#
# A pull-request comment is not a trigger. issue_comment runs the workflow
# from the default branch and still has the GHCR publish token and the Attic
# cache token. The previous job checked out the pull request head and ran
# that head's composite actions, so anyone who could comment could take both
# tokens and push through them.
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to build"
        required: false
        default: "nativelink"
        type: choice
        options:
          - nativelink
          - nativelink-worker-init
          - nativelink-worker-lre-cc
      skip_signing:
        description: "Skip cosign signing"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-image:
    name: Build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Resolve image
        id: image
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          entry=$(jq -c --arg image "$IMAGE" '.include[] | select(.image == $image)' .github/images-matrix.json)
          if [ -z "$entry" ]; then
            echo "Unknown image: $IMAGE" >&2
            exit 1
          fi
          {
            echo "multi-arch=$(jq -r '.["multi-arch"]' <<<"$entry")"
            echo "components=$(jq -r '.components // ""' <<<"$entry")"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}

      - id: version
        uses: ./.github/actions/generate-version

      - name: Upload image
        uses: ./.github/actions/test-and-upload-image
        with:
          testing: false
          image: ${{ inputs.image }}
          multi-arch: ${{ steps.image.outputs.multi-arch }}
          components: ${{ steps.image.outputs.components }}
          tag: ${{ steps.version.outputs.version-string }}
          GHCR_USERNAME: ${{ vars.GHCR_PUBLISH_USER }}
          GHCR_PASSWORD: ${{ secrets.GHCR_PUBLISH_TOKEN }}
          force-push: true

      - name: Output image info
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:${{ steps.version.outputs.version-string }}
        run: |
          echo "### Published Image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Teardown Worker
        uses: ./.github/actions/end-nix
        if: always()
        with:
          nativelink_attic_token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}
