name: CI

# Controls when the workflow will run.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

