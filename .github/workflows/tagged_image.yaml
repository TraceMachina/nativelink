---
name: Images / SemVer OCI
on:
  push:
    tags:
      - '*'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  get-images-matrix:
    name: Resolve image matrix
    runs-on: ubuntu-24.04
    outputs:
       matrix: ${{ steps.setmatrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set Images matrix
        id: setmatrix
        run: |
          MATRIX_STRINGIFIED=$(jq -c . < .github/images-matrix.json)
          echo "::set-output name=matrix::$MATRIX_STRINGIFIED"

  publish-image:
    name: Publish ${{ matrix.image }}
    needs: get-images-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-images-matrix.outputs.matrix) }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Upload image
        uses: ./.github/actions/publish-image
        with:
          testing: false
          image: ${{ matrix.image }}
          multi-arch: ${{ matrix.multi-arch }}
          components: ${{ matrix.components }}
          tag: ${{github.ref_name}}
          # This workflow only runs on tag pushes, so github.ref is
          # refs/tags/* (never refs/heads/main). Without force-push the upload
          # steps in test-and-upload-image are skipped and the tag never gets
          # attached to the pushed images.
          force-push: true
          ghcr-username: ${{ vars.GHCR_PUBLISH_USER }}
          ghcr-password: ${{ secrets.GHCR_PUBLISH_TOKEN }}
          nix-name: .#${{ matrix.image }}
          nativelink-attic-token: ${{ secrets.NATIVELINK_ATTIC_TOKEN }}
