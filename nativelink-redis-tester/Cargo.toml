#:schema ../tools/cargo-with-detailed-deps.json
lints.workspace = true

[package]
edition = "2024"
name = "nativelink-redis-tester"
version = "1.8.7"

[dependencies]
nativelink-util = { path = "../nativelink-util" }

either = { version = "1.15.0", default-features = false }
redis = { version = "1.0.2", default-features = false, features = ["tokio-comp"] }
redis-protocol = { version = "6.0.0", default-features = false, features = [
  "bytes",
  "resp2",
  "resp3",
  "std",
] }
redis-test = { version = "1.0.0", default-features = false, features = ["aio"] }
tokio = { version = "1.53.3", features = ["time"], default-features = false }
tracing = { version = "0.1.41", default-features = false }

[dev-dependencies]
nativelink-macro = { path = "../nativelink-macro" }

tokio = { version = "1.53.3", features = [
  "macros",
  "rt",
  "test-util",
  "time",
], default-features = false }
tracing-test = { version = "0.2.5", default-features = false, features = [
  "no-env-filter",
] }

[package.metadata.cargo-machete]
# Used by nativelink_test macro
ignored = ["tracing-test"]
