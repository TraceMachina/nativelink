---
# Steps for both Buildkite pipelines. Each pipeline's cluster sends a step
# to its own default queue, so no step names a queue.
# - The trusted pipeline: branches and members' pull requests, on warm
#   agents, with remote execution on ci.nativelink.com.
# - The untrusted pipeline, whose slug ends in -forks: other forks' pull
#   requests, each job in a fresh pod whose only credential is a key that
#   reads the cache. It uploads this file from main, so a fork cannot change
#   these steps.
steps:
  - label: ":bazel: Bazel test"
    key: bazel
    command: .buildkite/test-bazel.sh
    timeout_in_minutes: 180
    retry:
      automatic:
        # The agent was lost, for example when its node was replaced.
        - exit_status: -1
          limit: 2

  - label: ":nix: Nix build"
    key: nix
    if: pipeline.slug !~ /-forks$/
    command: .buildkite/nix-build.sh
    timeout_in_minutes: 120
    retry:
      automatic:
        - exit_status: -1
          limit: 2

  # Checks that need no secrets, so both lanes run them. A step with
  # if_changed runs only when the build changes a file it lists; buildkite-agent
  # applies that on upload, and runs the step anyway if it cannot tell.
  - label: ":pre-commit: Pre-commit"
    key: pre-commit
    command: .buildkite/pre-commit.sh
    timeout_in_minutes: 30
    retry:
      automatic:
        - exit_status: -1
          limit: 2

  # GitHub's Vale check reports errors without failing, so this does too.
  - label: ":memo: Vale"
    key: vale
    if: build.pull_request.id != null
    command: .buildkite/vale.sh
    soft_fail: true
    timeout_in_minutes: 10

  - label: ":books: Docs lint"
    key: docs-lint
    command: .buildkite/docs-lint.sh
    timeout_in_minutes: 30
    if_changed:
      - web/apps/docs/**
      - .buildkite/docs-lint.sh

  - label: ":globe_with_meridians: Web"
    key: web
    if: build.pull_request.id != null
    command: .buildkite/web.sh
    timeout_in_minutes: 45
    if_changed:
      - web/**
      - "**.md"
      - nativelink-config/**
      - tools/**
      - "**.lock"
      - "**.nix"
      - .buildkite/web.sh

  - label: ":link: Release references"
    key: release-refs
    if: build.pull_request.id != null
    command: >-
      nix shell --no-write-lock-file --inputs-from . nixpkgs#nodejs_22 --command
      node web/apps/docs/scripts/check-release-refs.mjs
    timeout_in_minutes: 10
    if_changed:
      - README.md
      - web/apps/docs/content/**
      - web/apps/web/content/**
      - web/apps/docs/scripts/check-release-refs.mjs
