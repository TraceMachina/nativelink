  { message = "Redo worker_find_logging as config", group = "<!-- 1 -->⛰️  Features" },
  { message = "Remove nativelink-proto as build dependency", group = "<!-- 4 -->🧪 Testing & CI" },
  { message = "Retry GrpcStore get_part_ref", group = "<!-- 1 -->⛰️  Features" },
  { message = "Shard store weight scale distribution", group = "<!-- 1 -->⛰️  Features" },
  { message = "Upgrade crossbeam-epoch and serial_test", group = "<!-- 7 -->⬆️ Bumps & Version Updates" },
  { message = "Upgrade to Bazel 9.1.1 and 8.7.0", group = "<!-- 7 -->⬆️ Bumps & Version Updates" },
  { message = "Use mimalloc", group = "<!-- 1 -->⛰️  Features" },
  # Non-conventional types ("scheduler:", "worker:") keep the description out
  # of the verb rules below, and the message rules see the whole commit body:
  # #2784 landed in Testing & CI because its body discusses tests, #2750 in
  # Features because its body says "Add". Pin both by their subject.
  { message = "fail queued actions with criteria no worker can meet", group = "<!-- 1 -->⛰️  Features" },
  { message = "fix active counts when a client disappears", group = "<!-- 2 -->🐛 Bug Fixes" },
  { message = "keep directory construction retries on the same lock", group = "<!-- 2 -->🐛 Bug Fixes" },
  # A conventional ci: commit whose description mentions docs or a scope the
  # verb rules claim first: #2878 reads "docs-only", #2874 is ci(nix), and
  # #2863 is a dependency bump the generic Update rule misses.
  { message = "skip the sanitizer lane on docs-only changes", group = "<!-- 4 -->🧪 Testing & CI" },
  { message = "update dependency typescript", group = "<!-- 7 -->⬆️ Bumps & Version Updates" },
  { message = "warm the Bazel Dev lane from the remote cache", group = "<!-- 4 -->🧪 Testing & CI" },

  # Get all breaking changes first.
  { message = "BREAKING", group = "<!-- 0 -->❌️  Breaking Changes" },
