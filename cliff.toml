[changelog]
# changelog header
header = """
<!-- vale off -->
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
# template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}](<REPO>/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\

{% macro commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | split(pat="\n") | first }} - ([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }}))\
{% endmacro %}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::commit(commit=commit) }}
    {%- endfor -%}
    {% raw %}\n{% endraw %}\
    {%- for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor %}\n
"""
# template for the changelog footer
footer = """
<!-- generated by git-cliff -->
<!-- vale on -->
"""
# remove the leading and trailing whitespace from the templates
trim = true
# postprocessors
postprocessors = [
  { pattern = '<REPO>', replace = "https://github.com/TraceMachina/nativelink" }, # replace repository URL
]

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = false
# process each line of a commit as an individual commit
split_commits = false
# regex for preprocessing the commit messages
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))" },
  { pattern = 'a license to protect the team', replace = 'Extended license to FSL-Apache' },
]
# regex for parsing and grouping commits
commit_parsers = [
  { message = "Fix a blocking-pool deadlock", group = "<!-- 2 -->🐛 Bug Fixes" },
  { message = "Pipeline BEP stream store writes", group = "<!-- 2 -->🐛 Bug Fixes" },
  { message = "tolerate backwards clock steps in worker liveness refresh", group = "<!-- 2 -->🐛 Bug Fixes" },
  # The config reference is regenerated by a workflow on every release tag, so
  # its commit says nothing a reader of the changelog needs. Matched on the
  # scope, because conventional_commits puts "config-reference" there and the
  # message parsers only see the description.
  { field = "scope", pattern = "config-reference", skip = true },

  # The llms files are regenerated by a workflow too; same reasoning.
  { field = "scope", pattern = "llms", skip = true },

  # Custom rules for specific commits.

  { message = "Resend a retried event-sink write from offset zero", group = "<!-- 2 -->🐛 Bug Fixes" },

