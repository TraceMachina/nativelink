  { message = "Sorted index reads return the whole set", group = "<!-- 2 -->🐛 Bug Fixes" },
  { message = "Support queueing-service through an opt-in gRPC event sink", group = "<!-- 1 -->⛰️  Features" },
  { message = "Worker advertises CPU and memory from its own cgroup limits", group = "<!-- 1 -->⛰️  Features" },
  { message = "Worker readiness follows scheduler registration", group = "<!-- 1 -->⛰️  Features" },
  { message = "a configurable pool with an idle sweeper", group = "<!-- 1 -->⛰️  Features" },
  { message = "a disk soft limit, and peak_disk_kb", group = "<!-- 1 -->⛰️  Features" },
  { message = "a fast tier that ends short on a digest resumes from the slow store", group = "<!-- 2 -->🐛 Bug Fixes" },
