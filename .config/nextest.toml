[test-groups]
mongo-embedded = { max-threads = 1 }

[profile.default]
fail-fast = false
failure-output = "immediate-final"
final-status-level = "slow"
slow-timeout = { period = "60s", terminate-after = 3 }
status-level = "pass"

[[profile.default.overrides]]
filter = "binary(mongo_store_test)"
test-group = "mongo-embedded"
