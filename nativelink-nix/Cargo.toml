lints.workspace = true

[package]
description = "Nix binary-cache protocol primitives for NativeLink — nixbase32, narinfo, ed25519 signing"
edition = "2024"
name = "nativelink-nix"
version = "1.8.1"

[dependencies]
nativelink-error = { path = "../nativelink-error" }
nativelink-proto = { path = "../nativelink-proto" }

base64 = { version = "0.22.1", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = [
  "std",
] }
hex = { version = "0.4.3", default-features = false, features = ["std"] }
prost = { version = "0.14.4", default-features = false }
prost-types = { version = "0.14.4", default-features = false }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = [
  "bit-set",
  "std",
] }
